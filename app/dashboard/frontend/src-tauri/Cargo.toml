[package]
name = "ainovel-write"
version = "0.1.0"
description = "AInovel Harness - layered prompt engine with ablation-based evaluation for long-form fiction"
authors = ["Shonean"]
edition = "2021"

[lib]
name = "ainovel_write_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
