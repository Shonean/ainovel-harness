<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #faf7f0; color: #464034; font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
  }
  .spinner {
    width: 40px; height: 40px; border: 3px solid #cfc6b2; border-top-color: #3a352c;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 14px; color: #7a7262; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>正在启动 AInovel Harness 引擎…</p>
</body>
</html>
